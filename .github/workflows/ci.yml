name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust tests
        run: cargo test --manifest-path packages/shield/native/Cargo.toml

      - name: Publish diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile > install.log 2>&1 || true
          tail -c 40000 install.log > install-tail.log
          {
            echo "run: ${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            cat install-tail.log
          } > issue-body.md
          gh issue create --title "ci diagnostics ${{ github.run_id }}" --body-file issue-body.md
