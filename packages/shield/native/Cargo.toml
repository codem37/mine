[package]
name = "mine-shield"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
url = "2"
adblock = { version = "0.9", default-features = false, features = [
  "embedded-domain-resolver",
] }
