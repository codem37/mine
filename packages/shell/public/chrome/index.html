<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>mine chrome</title>
    <link rel="stylesheet" href="./chrome.css" />
  </head>
  <body>
    <div class="bar">
      <button id="back" type="button">&larr;</button>
      <button id="fwd" type="button">&rarr;</button>
      <button id="reload" type="button">r</button>
      <button id="stop" type="button">x</button>
      <form id="go">
        <input id="url" type="text" autocomplete="off" spellcheck="false" />
      </form>
      <button id="newtab" type="button">+</button>
    </div>
    <ul id="tabs"></ul>
    <script type="module" src="./chrome.js"></script>
  </body>
</html>
